spring:
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:ecommerce}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 10
      max-size: 50

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

management:
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.saas.ecommerce: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{tenant}] [%thread] %logger{36} - %msg%n"
