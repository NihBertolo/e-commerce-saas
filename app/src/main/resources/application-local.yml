spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/ecommerce
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      initial-size: 5
      max-size: 20

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET:changeme-local}
  expiration: ${JWT_EXPIRATION:3600} # segundos

logging:
  level:
    root: INFO
    org.springframework.r2dbc: DEBUG
    com.saas.ecommerce: DEBUG
